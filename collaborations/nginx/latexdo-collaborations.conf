# LatexDo collaboration server — nginx reverse proxy.
# The installer replaces `collaborations.example.com` with your domain and
# certbot adds the TLS (443) server block automatically.

# Network-level rate limit (in addition to the app's per-IP limiter).
limit_req_zone $binary_remote_addr zone=latexdo_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=latexdo_conn:10m;

# Access log WITHOUT the query string, so session/share tokens that some
# clients pass as `?share=...` never get written to disk.
map $uri $latexdo_log_uri {
    ~^/api/shares/ /api/shares/[redacted];
    default $uri;
}

log_format latexdo_privacy '$remote_addr - [$time_local] '
                           '"$request_method $latexdo_log_uri" $status $body_bytes_sent '
                           'rt=$request_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name collaborations.example.com;

    client_max_body_size 25m;

    access_log /var/log/nginx/latexdo-collaborations.access.log latexdo_privacy;
    error_log  /var/log/nginx/latexdo-collaborations.error.log warn;

    # Basic hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    location /api/ {
        limit_req zone=latexdo_api burst=40 nodelay;
        limit_conn latexdo_conn 100;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for real-time collaboration.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Everything else 404s; this server only serves the collaboration API.
    location / {
        return 404;
    }
}
