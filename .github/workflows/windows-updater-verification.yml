name: windows-updater-verification

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-update-verification]

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        helper: [released, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run build
      - name: Package candidate
        run: npx electron-builder --win nsis --x64 --publish never --config.directories.output=release/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Download existing released installation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pin the releases affected by the report, rather than moving "latest".
          $tag = if ('${{ matrix.runner }}' -eq 'windows-2022') {
            'v1.0.0-build.183.1.73626277bea4'
          } else {
            'v1.0.0-build.175.1.c8cb4c589024'
          }
          gh release download $tag --repo '${{ github.repository }}' --pattern 'LatexDo-windows-x64.exe' --pattern 'SHA256SUMS.txt' --dir baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not download baseline release' }
          $expected = ((Get-Content baseline/SHA256SUMS.txt | Where-Object { $_ -match 'LatexDo-windows-x64.exe$' }) -split '\s+')[0]
          $actual = (Get-FileHash baseline/LatexDo-windows-x64.exe -Algorithm SHA256).Hash
          if (-not $expected -or $expected -ne $actual) { throw 'Baseline checksum mismatch' }
          "LATEXDO_BASELINE_INSTALLER=$((Resolve-Path baseline/LatexDo-windows-x64.exe).Path)" >> $env:GITHUB_ENV
      - name: Upgrade existing running application
        run: node scripts/test-windows-updater.mjs
        env:
          LATEXDO_TEST_HELPER: ${{ matrix.helper }}
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.runner }}-${{ matrix.helper }}
          path: test-results/windows-updater/
          if-no-files-found: warn
